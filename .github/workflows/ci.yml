# Runs every test on each push to main and on pull requests, so a broken commit shows a red ✗ on GitHub
# before Render deploys it. The server tests need MongoDB: a throwaway mongo container plays the part that
# `docker compose up -d` plays on your laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    # shortcut: pinned to 24.04 because ubuntu-latest moved to Ubuntu 26, whose Linux 6.19+ kernel MongoDB 8 refuses
    # to start on ("known incompatibility", SERVER-121912). Back to ubuntu-latest once a mongo:8 release fixes it.
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        # Waited for by the "Wait for MongoDB" step below (a port check) rather than a container health check.
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Wait for MongoDB
        run: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/27017) 2>/dev/null && exit 0; sleep 1; done; exit 1
      # vitest.config.js points the tests at mongodb://localhost:27017/image-processing-test (the container).
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
