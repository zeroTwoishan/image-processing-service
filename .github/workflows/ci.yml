# Runs every test on each push to main and on pull requests, so a broken commit shows a red ✗ on GitHub
# before Render deploys it. The server tests need MongoDB: a throwaway mongo container plays the part that
# `docker compose up -d` plays on your laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        # shortcut: MongoDB 7 here, 8 on your laptop and Atlas. GitHub's runners now use Linux 6.19+, which
        # MongoDB 8.0+ refuses to start on (a memory-allocator bug, SERVER-121912). The app uses nothing 8-only.
        # Back to mongo:8 once a release starts on these runners.
        image: mongo:7
        ports: ['27017:27017']
        # Waited for by the "Wait for MongoDB" step below (a port check) rather than a container health check.
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Wait for MongoDB
        run: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/27017) 2>/dev/null && exit 0; sleep 1; done; exit 1
      # vitest.config.js points the tests at mongodb://localhost:27017/image-processing-test (the container).
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # A real browser through the whole app: Playwright starts the API and Vite itself (playwright.config.js).
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7 # same reason as the server job
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      # Only Chromium (both projects use it), plus the Linux libraries it needs.
      - run: npx playwright install --with-deps chromium
      - name: Wait for MongoDB
        run: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/27017) 2>/dev/null && exit 0; sleep 1; done; exit 1
      - run: npm run test:e2e
      # On a failure, the report has a screenshot and a step-by-step trace of what the browser saw.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
