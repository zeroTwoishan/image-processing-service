# Runs every test on each push to main and on pull requests, so a broken commit shows a red ✗ on GitHub
# before Render deploys it. The server tests need MongoDB: a throwaway mongo container plays the part that
# `docker compose up -d` plays on your laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        # No container health check: on GitHub's runner it reported "unhealthy" 0.1 s after start, before Mongo
        # could boot. The "Wait for MongoDB" step below waits for the port instead.
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Wait for MongoDB
        run: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/27017) 2>/dev/null && exit 0; sleep 1; done; exit 1
      # vitest.config.js points the tests at mongodb://localhost:27017/image-processing-test (the container).
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
