<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141211" />
    <title>Darkroom</title>
    <!-- Link-preview bots (LinkedIn, WhatsApp, X) and search crawlers read this raw HTML without running
         JavaScript, so these tags must live here, not in React. og:image must be an absolute URL. -->
    <meta
      name="description"
      content="Upload a photo, then rotate, crop, resize, filter, watermark and convert it in your browser. See every edit live, apply once, download the result. Photos are deleted after 12 hours."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Darkroom" />
    <meta property="og:title" content="Darkroom: a photo editor in your browser" />
    <meta property="og:description" content="Rotate, crop, filter, watermark and convert photos. Live preview, one Apply, download the result." />
    <meta property="og:url" content="https://darkroom-ishan.vercel.app/" />
    <meta property="og:image" content="https://darkroom-ishan.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Darkroom's editor: a portrait photo with a sepia filter, a crop and a watermark previewed live" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
