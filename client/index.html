<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a09" />
    <!-- Written for the "Try it" page at /, the one page people find by searching (it sets the same title in React). -->
    <title>Free online photo editor: crop, rotate, convert · Darkroom</title>
    <!-- Link-preview bots (LinkedIn, WhatsApp, X) and search crawlers read this raw HTML without running
         JavaScript, so these tags must live here, not in React. og:image must be an absolute URL. -->
    <meta
      name="description"
      content="Rotate, crop, resize, add a filter or a watermark, and convert photos to JPEG, PNG, WebP or AVIF in your browser. Free, no account needed, nothing saved."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Darkroom" />
    <meta property="og:title" content="Darkroom: a photo editor in your browser" />
    <meta property="og:description" content="Rotate, crop, filter, watermark and convert photos. Live preview, one Apply, download the result." />
    <meta property="og:url" content="https://darkroom-ishan.vercel.app/" />
    <meta property="og:image" content="https://darkroom-ishan.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Darkroom: Edit photos in your browser, beside the editor previewing a sepia crop with a watermark" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint: the page draws at once in the fallback fonts, then swaps in these
         (display=swap). A plain stylesheet link would make the browser wait for Google before showing anything. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
